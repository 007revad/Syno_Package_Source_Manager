<!DOCTYPE html>
<html>
<head>
    <title>Package Source Manager</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/icon_256.png">
    <link rel="shortcut icon" href="images/icon_256.png">
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: white;
        }
        .container {
            background-color: white;
        }
        .feeds-section {
            margin: 20px 20px 0 20px;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            overflow: hidden;
        }
        .feed-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .feed-row:last-child {
            border-bottom: none;
        }
        .feed-info {
            display: flex;
            flex-direction: column;
        }
        .feed-name {
            font-weight: bold;
            color: #0066cc;
        }
        .feed-url {
            font-size: 13px;
            color: #777;
            word-break: break-all;
        }
        .delete-row-btn {
            flex-shrink: 0;
            margin-left: 14px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #b00;
            font-size: 15px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
        }
        .delete-row-btn:hover {
            background: #ffe0e0;
        }
        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
            flex-shrink: 0;
            margin-left: 20px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .2s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1B8AED;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin: 20px;
        }
        button {
            padding: 5px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        #saveBtn {
            border: none;
            background-color: #1B8AED;
            color: white;
        }
        #saveBtn:hover {
            background-color: #057FEB;
        }
        #cancelBtn {
            border: 1px solid #ccc;
            background-color: white;
            color: #333;
        }
        #cancelBtn:hover {
            border: 1px solid #aaa;
            background-color: #f0f0f0;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin: 0 20px 20px 20px;
            height: 40px;
            line-height: 20px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-weight: bold;
            font-size: 13px;
            box-sizing: content-box;
            white-space: normal;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .status.success {
            color: #008800;
            background: #e6ffe6;
            border: 1px solid #ccffcc;
        }
        .status.error {
            color: #cc0000;
            background: #ffe6e6;
            border: 1px solid #ffcccc;
        }
        .status.info {
            color: #0066cc;
            background: #e6f3ff;
            border: 1px solid #cce6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="feeds-section">
            <div id="feedList">Loading community sources...</div>
        </div>

        <div class="status" id="status"></div>

        <div class="actions">
            <button id="cancelBtn">Cancel</button>
            <button id="saveBtn">Save</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
